name: Refresh anime search index

on:
  schedule:
    - cron: '0 16 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build-anime-index.mjs'
      - '.github/workflows/sync-anime-index.yml'

permissions:
  contents: write
  actions: write

concurrency:
  group: anime-search-index
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download latest anime database
        shell: bash
        run: |
          url=$(curl -fsSL https://api.github.com/repos/manami-project/anime-offline-database/releases/latest | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=j.assets.find(x=>x.name==='anime-offline-database-minified.json');if(!a)process.exit(2);process.stdout.write(a.browser_download_url)})")
          curl -L --fail --retry 4 --retry-delay 2 "$url" -o /tmp/anime-db.json
      - name: Build compact search index
        run: node scripts/build-anime-index.mjs /tmp/anime-db.json
      - name: Commit refreshed index
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/anime-index.json
          if git diff --cached --quiet; then
            echo "Index unchanged."
            exit 0
          fi
          git commit -m "Refresh anime search index"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Deploy refreshed index
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
