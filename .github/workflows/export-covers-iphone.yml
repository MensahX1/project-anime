name: Export anime covers for iPhone

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-covers-iphone.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cover-sync
  cancel-in-progress: true

jobs:
  export:
    name: Build iPhone ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download bulk anime metadata database
        shell: bash
        run: |
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://github.com/manami-project/anime-offline-database/releases/download/2026-27/anime-offline-database-minified.json' \
            -o /tmp/anime-db.json
          echo "Database size: $(du -h /tmp/anime-db.json | cut -f1)"
      - name: Match all titles and download covers
        run: node scripts/export-covers-bulk.mjs /tmp/anime-db.json
      - name: Prepare iPhone upload folder
        shell: bash
        run: |
          mkdir -p iphone-upload/public/covers iphone-upload/src
          cp public/covers/*.jpg iphone-upload/public/covers/
          cp src/generatedCovers.json src/coverSources.json iphone-upload/src/
          cat > iphone-upload/UPLOAD-INSTRUCTIONS.txt <<'TXT'
          LE ANIME COVER PACKAGE

          Copy these paths into the root of MensahX1/project-anime:
            public/covers/*.jpg
            src/generatedCovers.json
            src/coverSources.json

          Commit message suggestion:
            Store all anime cover artwork

          After that commit, normal Vite Pages deployments do not need to download covers again.
          TXT
          test "$(find iphone-upload/public/covers -type f -name '*.jpg' | wc -l)" -eq 183
      - uses: actions/upload-artifact@v4
        with:
          name: le-anime-covers-iphone
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          path: iphone-upload/
