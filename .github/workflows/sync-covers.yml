name: Sync anime covers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-covers.yml'
      - 'scripts/sync-covers.mjs'
      - 'src/anime.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: anime-cover-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync repo-hosted covers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for missing local covers
        id: missing
        shell: bash
        run: |
          set +e
          node scripts/sync-covers.mjs --check-only
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "All covers already exist in public/covers."
          elif [[ $status -eq 10 ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            exit $status
          fi

      - name: Download anime metadata database
        if: steps.missing.outputs.needed == 'true'
        shell: bash
        run: |
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://github.com/manami-project/anime-offline-database/releases/download/2026-27/anime-offline-database-minified.json' \
            -o /tmp/anime-db.json

      - name: Sync local cover files and manifests
        if: steps.missing.outputs.needed == 'true'
        run: node scripts/sync-covers.mjs /tmp/anime-db.json

      - name: Apply manifest and stale-cover cleanup when no download is needed
        if: steps.missing.outputs.needed == 'false'
        run: node scripts/sync-covers.mjs

      - name: Commit repo-hosted cover changes
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers src/generatedCovers.json src/coverSources.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Sync anime cover assets"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the cover commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
