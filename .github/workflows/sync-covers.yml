name: Sync anime covers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-covers.yml'
      - 'scripts/sync-covers.mjs'
      - 'src/anime.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-cover-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync repo-hosted covers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check for missing local covers
        id: missing
        shell: bash
        run: |
          set +e
          node scripts/sync-covers.mjs --check-only
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "All covers already exist in public/covers."
          elif [[ $status -eq 10 ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            exit $status
          fi

      - name: Download latest anime metadata database
        if: steps.missing.outputs.needed == 'true'
        shell: bash
        run: |
          url=$(curl -fsSL https://api.github.com/repos/manami-project/anime-offline-database/releases/latest | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=j.assets.find(x=>x.name==='anime-offline-database-minified.json');if(!a)process.exit(2);process.stdout.write(a.browser_download_url)})")
          curl -L --fail --retry 4 --retry-delay 2 "$url" -o /tmp/anime-db.json

      - name: Sync local cover files and manifests
        if: steps.missing.outputs.needed == 'true'
        run: node scripts/sync-covers.mjs /tmp/anime-db.json

      - name: Apply manifest and stale-cover cleanup when no download is needed
        if: steps.missing.outputs.needed == 'false'
        run: node scripts/sync-covers.mjs

      - name: Commit repo-hosted cover changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers src/generatedCovers.json src/coverSources.json
          if git diff --cached --quiet; then
            echo "No cover changes were needed."
            exit 0
          fi
          git commit -m "Sync anime cover assets"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
