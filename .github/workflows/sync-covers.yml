name: Sync anime covers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-covers.yml'
      - 'scripts/export-covers-bulk.mjs'
      - 'src/allTitles.json'
      - 'src/seed1.json'
      - 'src/seed2.json'
      - 'src/seed3.json'
      - 'src/seed4.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: anime-cover-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync missing repo-hosted covers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check for missing local covers
        id: missing
        shell: bash
        run: |
          set +e
          node scripts/export-covers-bulk.mjs --check-only
          status=$?
          set -e
          if [[ $status -eq 0 ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "All covers already exist in public/covers."
          elif [[ $status -eq 10 ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            exit $status
          fi

      - name: Download anime metadata database
        if: steps.missing.outputs.needed == 'true'
        shell: bash
        run: |
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://github.com/manami-project/anime-offline-database/releases/download/2026-27/anime-offline-database-minified.json' \
            -o /tmp/anime-db.json

      - name: Download only missing covers
        if: steps.missing.outputs.needed == 'true'
        run: node scripts/export-covers-bulk.mjs /tmp/anime-db.json

      - name: Commit repo-hosted covers
        id: commit
        if: steps.missing.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/covers src/generatedCovers.json src/coverSources.json
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(git diff --cached --name-only -- 'public/covers/*.jpg' | wc -l | tr -d ' ')
          git commit -m "Store ${count} missing anime cover(s)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the cover commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --ref main
