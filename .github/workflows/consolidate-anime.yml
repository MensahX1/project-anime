name: Consolidate anime data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/consolidate-anime.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Consolidate seed files
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const files=['src/seed1.json','src/seed2.json','src/seed3.json','src/seed4.json'];
          const anime=(await Promise.all(files.map(async f=>JSON.parse(await fs.readFile(f,'utf8'))))).flat();
          if(anime.length!==183) throw new Error(`Expected 183 anime, got ${anime.length}`);
          const ids=new Set(anime.map(a=>a.id));
          const titles=new Set(anime.map(a=>a.title));
          if(ids.size!==anime.length||titles.size!==anime.length) throw new Error('Duplicate id or title found');
          await fs.writeFile('src/anime.json',JSON.stringify(anime,null,2)+'\n');
          console.log(`Wrote ${anime.length} records to src/anime.json`);
          NODE
      - name: Commit consolidated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/anime.json
          git diff --cached --quiet && exit 0
          git commit -m "Consolidate anime data into one file"
          git push
