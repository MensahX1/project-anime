name: Audit franchise gaps

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-franchise-gaps.yml'
      - 'scripts/audit-franchise-gaps.mjs'
      - 'src/anime.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download anime database
        run: |
          curl -L --fail --retry 4 --retry-delay 2 \
            'https://github.com/manami-project/anime-offline-database/releases/download/2026-27/anime-offline-database-minified.json' \
            -o /tmp/anime-db.json
      - name: Audit related anime
        run: node scripts/audit-franchise-gaps.mjs /tmp/anime-db.json
      - uses: actions/upload-artifact@v4
        with:
          name: franchise-audit
          path: franchise-audit.json
          retention-days: 7
